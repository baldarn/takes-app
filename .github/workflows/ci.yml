name: CI

on:
  pull_request:
  push:
    branches: [main]

# Reads the code and nothing else. No secrets are used, so pull requests from forks run the same way.
permissions:
  contents: read

# A newer push to the same pull request or branch replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image has an Android SDK. The native modules need this NDK, and their host
      # tests call the SDK's CMake 3.22.1 directly, before the Android Gradle plugin would fetch it.
      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      # Caches the Gradle distribution and dependencies. Runs for pull requests read the cache of main.
      # From v6 the action's default cache is a proprietary component under Gradle's Terms of Use;
      # "basic" is its open-source cache on top of actions/cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # sherpa-onnx (about 49 MB, with ONNX Runtime) and its library for this computer, which the
      # speech module downloads from the sherpa-onnx release and checks against a SHA-256.
      - uses: actions/cache@v6
        with:
          path: speech/.sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('speech/build.gradle.kts') }}

      # DeepFilterNet3's weights (8.6 MB), which the deepfilter module downloads from Hugging
      # Face, checks against a SHA-256 and packs into the app.
      - uses: actions/cache@v6
        with:
          path: |
            deepfilter/models
          key: deepfilter-model-${{ hashFiles('deepfilter/build.gradle.kts') }}

      # No keystore here: only the debug build is assembled, which needs none.
      - name: Test, lint and build
        run: ./gradlew :core:test :rnnoise:testDebugUnitTest :speech:testDebugUnitTest :deepfilter:testDebugUnitTest :stabilization:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports
            */build/test-results
          retention-days: 7

      - name: Keep the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: takes-dev-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  pixels:
    name: Pixel tests of the shaders on an emulator (${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    # The whole suite took about 41 minutes on a 4-core emulator with SwiftShader on a desktop
    # computer, and with its 475 cases about 95 minutes on GitHub's runner: the export's effect
    # chain is slow to draw on the processor. So six runners share it, each taking every sixth
    # case, and one that fails does not stop the others (with four, the slowest needed over an hour).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      API_LEVEL: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: actions/cache@v6
        with:
          path: speech/.sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('speech/build.gradle.kts') }}

      # DeepFilterNet3's weights (8.6 MB), which the deepfilter module downloads from Hugging
      # Face, checks against a SHA-256 and packs into the app.
      - uses: actions/cache@v6
        with:
          path: |
            deepfilter/models
          key: deepfilter-model-${{ hashFiles('deepfilter/build.gradle.kts') }}

      # Built before the emulator starts, so that the emulator only installs and runs them.
      - name: Build the debug build and its test build
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # The emulator needs hardware acceleration, which ubuntu runners give through /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator with its system image, booted once and kept as a snapshot. Runs for pull
      # requests read the cache of main.
      - uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Make the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "The snapshot is made."

      # The GL of the emulator is SwiftShader, on the processor, as a computer without a GPU has.
      # The script fails when the report holds FAILURES!!!, does not end in OK, or the
      # instrumentation crashes.
      - name: Run the pixel tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./scripts/pixel-tests.sh -e shards 6 -e shard ${{ matrix.shard }}
